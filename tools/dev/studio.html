<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio</title>
<style>html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#err{position:fixed;left:8px;top:8px;color:#f66;font:12px monospace;white-space:pre-wrap}</style>
<script type="importmap">
{ "imports": { "three": "../../vendor/three/build/three.module.js", "three/addons/": "../../vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="gl"></canvas><div id="err"></div>
<script type="module">
// Fixed four-view sheet of one game car, for checking a model without driving.
//   studio.html?car=porsche&team=0&look=studio|track&views=a,b,c,d&one=front
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
window.onerror = (m, s, l) => { document.getElementById('err').textContent += `${m} ${s}:${l}\n`; };
window.onunhandledrejection = (e) => { document.getElementById('err').textContent += (e.reason?.stack || e.reason) + '\n'; };
const { buildCar } = await import('../../src/render/carmodel.js');
const { TEAMS } = await import('../../src/teams.js');
const q = new URLSearchParams(location.search);
const car = q.get('car') || 'porsche', look = q.get('look') || 'studio';
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.03).texture;
const track = look === 'track';
scene.background = new THREE.Color(track ? 0x9fb9d6 : 0x14171c);
scene.environmentIntensity = track ? 0.5 : 1;
renderer.toneMappingExposure = track ? 0.92 : 1;
const sun = new THREE.DirectionalLight(0xffffff, track ? 4.2 : 2.2);
sun.position.set(4, 9, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 30 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, new THREE.HemisphereLight(0xbfd6ff, 0x3a3a38, track ? 1.5 : 0.25));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: track ? 0x3b3d40 : 0x1d2026, roughness: track ? 0.92 : 0.5 }));
floor.receiveShadow = true; scene.add(floor);
const team = TEAMS[+(q.get('team') || 0)];
const mesh = buildCar(team, team.drivers[0][2], '#ffd400', car);
if (mesh.userData.blob) mesh.userData.blob.visible = false;
scene.add(mesh);
// name: [camera position, look-at, field of view]
const VIEWS = {
  front: [[6.2, 1.7, 3.9], [0.2, 0.55, 0], 26], rear: [[-6.4, 1.9, 3.6], [-0.2, 0.55, 0], 26],
  side: [[0.2, 0.75, 9], [0.2, 0.6, 0], 24], top: [[0.1, 10.5, 0.01], [0.1, 0, 0], 26],
  nose: [[8, 0.8, 0], [0, 0.6, 0], 17], tail: [[-8, 0.9, 0], [0, 0.6, 0], 17],
  low: [[4.6, 0.55, 2.6], [0.6, 0.5, 0], 30], chase: [[-7.2, 2.6, 0], [1, 0.6, 0], 34],
  high: [[4.2, 4.6, 3.4], [0, 0.4, 0], 28], wheel: [[2.4, 0.6, 2.6], [1.4, 0.4, 0.6], 26],
};
const names = q.get('one') ? [q.get('one')] : (q.get('views') || 'front,rear,side,top').split(',');
const cols = names.length > 1 ? 2 : 1, rows = Math.ceil(names.length / cols);
const cam = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
renderer.setScissorTest(true);
function draw() {
  const W = canvas.width, H = canvas.height, w = W / cols, h = H / rows;
  names.forEach((name, i) => {
    const [pos, at, fov] = VIEWS[name];
    cam.fov = fov; cam.aspect = w / h; cam.position.set(...pos); cam.up.set(0, 1, 0); if (name === 'top') cam.up.set(1, 0, 0);
    cam.lookAt(...at); cam.updateProjectionMatrix();
    const x = (i % cols) * w, y = H - (Math.floor(i / cols) + 1) * h;
    renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h);
    renderer.render(scene, cam);
  });
}
let tris = 0; mesh.traverse((o) => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
window.stats = { tris: Math.round(tris) };
draw(); requestAnimationFrame(draw);
document.title = 'ready ' + Math.round(tris);
</script>
</body>
</html>
