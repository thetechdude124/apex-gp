<style>

  .obox kbd { font: 800 11px/1 inherit; background: #f4f4f4; color: #000; border-radius: 3px; padding: 2px 6px; } .onote { color: #8b919c; font-size: 12.5px; line-height: 1.5; margin: 8px 0 0; }

  #rewind { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 13; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 2px, rgba(0,0,0,0) 2px 5px), rgba(20,30,60,0.18); }

  #replaybar b { font-style: italic; font-weight: 900; letter-spacing: 2px; color: var(--red); } #replaybar .rt { font-variant-numeric: tabular-nums; }
  #replaybar .rbar { width: 260px; height: 6px; background: #2a2d36; border-radius: 3px; overflow: hidden; } #replaybar .rbar i { display: block; height: 100%; background: var(--red); }
  #replaybar .rc { border-left: 4px solid; padding-left: 7px; } #replaybar small { flex-basis: 100%; text-align: center; color: #9aa0aa; font-weight: 400; } #replaybar kbd { font: 800 10px/1 inherit; background: #fff; color: #000; border-radius: 3px; padding: 2px 5px; margin: 0 1px; }
  #howto { background: none; border: 1px solid #3a3f4a; color: #fff; border-radius: 6px; padding: 8px 16px; font-weight: 800; letter-spacing: 1.5px; font-size: 12px; margin-left: 18px; vertical-align: middle; } #howto:hover { border-color: var(--red); background: var(--red); }
  #speedfx { position: absolute; inset: 0; pointer-events: none; }

  /* ---------- PAUSE / RESULTS ---------- */
  #pause { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; z-index: 15; }
  #pause h2 { font-style: italic; font-weight: 900; font-size: 40px; margin: 0 0 12px; }
  #pause button, #results button { width: 260px; padding: 13px; background: #1a1d26; color: #fff; border: 1px solid #2a2e3a; border-radius: 6px; font-weight: 800; letter-spacing: 1.5px; }
  #pause button:hover, #results button:hover { background: var(--red); border-color: var(--red); }
  #results { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(10,12,18,0.94); border-radius: 10px; padding: 24px 28px; display: none; z-index: 16; max-height: 92vh; overflow: auto; min-width: 640px; }
  #results h2 { margin: 0 0 14px; font-style: italic; font-weight: 900; letter-spacing: 1px; }
  #results table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  #results th { text-align: left; color: #9aa0aa; font-size: 11px; letter-spacing: 1px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  #results td { padding: 5px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  #results tr.me td { background: rgba(255,255,255,0.92); color: #000; }
  #results .c { display: inline-block; width: 4px; height: 13px; margin-right: 8px; vertical-align: -2px; }
  #results .purple { color: #c77dff; font-weight: 800; } #results .up { color: #39ff6a; } #results .down { color: #ff5252; }
  #results .btns { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
  #results button.go { background: var(--red); border-color: var(--red); } #results .qnote { text-align: center; margin-top: 14px; font-size: 17px; color: #c4c8d0; } #results .qnote b { color: #fff; font-size: 22px; font-style: italic; }
  /* ---------- PODIUM ---------- */
  #podium { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 34px; gap: 12px; z-index: 14; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.7) 100%); }
  #podium h2 { position: absolute; top: 26px; margin: 0; font-style: italic; font-weight: 900; font-size: 34px; letter-spacing: 3px; text-shadow: 0 2px 12px #000; }

  #podium .pc.p1 { border-top-color: #e8c14a; padding-bottom: 26px; width: 260px; } #podium .pc.p3 { border-top-color: #c98a4b; }
  #podium .pc.me { box-shadow: 0 0 0 2px #fff; }
  #podium .pc i { font-style: italic; font-weight: 900; font-size: 30px; line-height: 1; color: #c9ced6; } #podium .pc.p1 i { color: #e8c14a; font-size: 40px; } #podium .pc.p3 i { color: #c98a4b; }
  #podium .pc b { font-size: 19px; font-style: italic; } #podium .pc span { font-size: 12px; color: #c4c8d0; border-left: 4px solid; padding-left: 7px; letter-spacing: 0.5px; } #podium .pc em { font-style: normal; font-variant-numeric: tabular-nums; color: #9aa0aa; font-size: 13px; margin-top: 3px; }

  #podium button { pointer-events: auto; width: 260px; padding: 13px; background: var(--red); color: #fff; border: 0; border-radius: 6px; font-weight: 900; letter-spacing: 2px; font-style: italic; font-size: 16px; }

<body>
<canvas id="view"></canvas>

<div id="menu">
  <h1>APEX <span>GRAND PRIX</span><button id="howto">? HOW TO PLAY</button></h1>
  <div class="sub">Open-wheel racing simulation</div>
  <div class="cols">
    <div>
      <div class="tracks" id="tracks"></div>
      <div style="height:18px"></div>
      <div class="help" id="helpkeys"></div>
    </div>
    <div class="settings">
      <label class="full">Mode<div class="seg" id="mode"><button data-v="race" class="on">GRAND PRIX</button><button data-v="trial">TIME TRIAL</button></div></label>
      <label>Driver<select id="driver"></select><input type="text" id="dname" maxlength="24" placeholder="Your name" autocomplete="off" spellcheck="false"></label>
      <label>Team<select id="team"></select></label>
      <label>Laps<input type="number" id="laps" min="1" max="50" value="5"></label>
      <label>Rivals' skill: <span id="diffv">30</span><input type="range" id="diff" min="0" max="110" value="30"></label>
      <label>Starting grid<select id="grid"><option value="quali" selected>Qualify for it (one flying lap)</option><option value="random">Random slot</option><option value="mid">Midfield (P10)</option><option value="pole">Pole position</option><option value="back">Back of the grid</option></select></label>
      <label>Weather<select id="weather"><option value="random" selected>Random</option><option value="dry">Dry</option><option value="changing">Changeable (rain comes or goes)</option><option value="wet">Rain all race</option></select></label>
      <button id="go">START ▸</button>
      <button id="optBtn" class="full">ADVANCED SETTINGS<small>driving aids · race rules · controls · view · my car</small></button>
    </div>
  </div>
</div>

<div id="loading" class="hidden"><div id="loadtxt">BUILDING CIRCUIT</div><div class="bar"><i></i></div></div>

<div id="hud">
  <div id="tl">
    <div id="posbox"><div id="pos" class="panel"></div><div id="lap" class="panel"></div><div id="wx" class="panel"></div></div>
    <div id="tower" class="panel"></div>
  </div>
  <div id="tr" class="panel">
    <div class="big" id="curlap">0.000</div>
    <div id="lapinv">LAP INVALID · it will not count</div>
    <div class="r"><span>LAST</span><b id="lastlap">--</b></div>
    <div class="r"><span>BEST</span><b id="bestlap">--</b></div>
    <div class="secs"><div class="sec" id="s1"></div><div class="sec" id="s2"></div><div class="sec" id="s3"></div></div>
    <div id="delta"></div>
  </div>
  <canvas id="minimap" width="460" height="380"></canvas>
  <div id="pedals" class="panel"><div><i id="thr"></i></div><div><i id="brk"></i></div></div>
  <div id="dash" class="panel">
    <div id="revs"></div>
    <div id="spd"><span id="speed">0</span><small>KM/H</small></div>
    <div id="gear">N</div>
    <div class="bars"><span id="ers">ERS</span><div class="ersbg"><div id="ersbar"></div></div><span id="drs">DRS</span><span id="tyre">M</span></div>
  </div>
  <div id="mirror"></div>
  <div id="drsbig"><b>DRS</b><span id="drstxt"></span></div>
  <div id="pitbox" class="panel"></div>
  <div id="pitnow" class="panel"><b id="pitnowb"></b><span id="pitnows"></span></div>
  <div id="banner" class="panel"><b id="bannerb"></b><span id="banners"></span></div>
  <div id="startlights" class="panel"><div></div><div></div><div></div><div></div><div></div></div>
  <div id="toast"></div>
  <div id="camhint">C: camera · L: racing line · H: how to play · ESC: pause</div>
</div>

<div id="pause">
  <h2>PAUSED</h2>
  <button id="pResume">RESUME</button>
  <button id="pRestart">RESTART SESSION</button>
  <button id="pReplay">WATCH REPLAY</button>
  <button id="pOptions">SETTINGS · CONTROLS</button>
  <button id="pHelp">HOW TO PLAY</button>
  <button id="pMenu">QUIT TO MENU</button>
</div>
<div id="results"></div>
<div id="podium"></div>
<div id="rewind"><b>◀◀ FLASHBACK</b></div>
<div id="replaybar"></div>
<div id="options"></div>
<div id="tutorial"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
